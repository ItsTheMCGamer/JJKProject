plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.30-beta'
}

version = "${project.property('minecraft_version')}-${project.property('mod_version')}"
base {
    archivesName = project.property('mod_id')
}
group = project.property('mod_group_id')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.property('neo_version')

    accessTransformers = ['src/main/resources/META-INF/accesstransformer.cfg']

    parchment {
        mappingsVersion = project.property('parchment_mappings_version')
        minecraftVersion = project.property('parchment_minecraft_version')
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.property('mod_id')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.property('mod_id')
        }

        data {
            data()
            programArguments.addAll([
                    '--mod', project.property('mod_id'),
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            ])
        }

        configureEach {
            jvmArgument '-Dmixin.debug=true'
            jvmArgument '-Xmx4G'
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.property('mod_id')}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources.srcDir("src/generated/resources")
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Curios maven'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'OctoStudios'
        url = 'https://maven.octo-studios.com/releases'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
}

dependencies {
    // Curios
    compileOnlyApi "top.theillusivec4.curios:curios-neoforge:${project.property('curios_version')}"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.property('curios_version')}"

    // Lodestone - Use the exact same format as the working mod
    compileOnlyApi "team.lodestar.lodestone:lodestone:${project.property('minecraft_version')}-${project.property('lodestone_version')}"
    runtimeOnly "team.lodestar.lodestone:lodestone:${project.property('minecraft_version')}-${project.property('lodestone_version')}"
}

task generateModMetadata(type: ProcessResources) {
    def replaceProperties = [
            'minecraft_version': project.findProperty('minecraft_version'),
            'minecraft_version_range': project.findProperty('minecraft_version_range'),
            'neo_version': project.findProperty('neo_version'),
            'neo_version_range': project.findProperty('neo_version_range'),
            'loader_version_range': project.findProperty('loader_version_range'),
            'mod_id': project.findProperty('mod_id'),
            'mod_name': project.findProperty('mod_name'),
            'mod_license': project.findProperty('mod_license'),
            'mod_version': project.findProperty('mod_version'),
            'mod_authors': project.findProperty('mod_authors'),
            'mod_description': project.findProperty('mod_description'),
            'lodestone_version_range': project.findProperty('lodestone_version_range')
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)

    filesMatching('**/*.java') {
        exclude()
    }

    from('src/main/templates')
    into('build/generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

java {
    withSourcesJar()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}